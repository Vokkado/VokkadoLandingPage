    <!-- Rutas reales en GitHub Pages.
         1. 404.html manda cualquier ruta profunda acá como ?/ruta, y esto la
            devuelve a su URL verdadera antes de que React monte.
         2. Los links viejos con #/ruta siguen funcionando: se traducen a /ruta.
         Va antes que cualquier script de la app, a propósito. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
        if (l.hash.indexOf('#/') === 0) {
          window.history.replaceState(null, '', l.hash.slice(1));
        }
      }(window.location));
    </script>
