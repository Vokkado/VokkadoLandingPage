name: Update preguntas frecuentes

# Trae las FAQs que se cargan desde el admin de Vokkado y las publica como un
# archivo estático. Mismo esquema que update-reviews.yml.
#
# Requiere el secret VOKKADO_API_URL apuntando a la API de producción, con /api
# incluido. Por ejemplo: https://api.vokkado.com/api
# El endpoint que usa es público (GET /api/faqs), no hace falta ningún token.

on:
  schedule:
    - cron: '30 9 * * *' # todos los días 09:30 UTC (~06:30 UY), después de las reseñas
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-faqs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Fetch FAQs
        working-directory: source
        env:
          VOKKADO_API_URL: ${{ secrets.VOKKADO_API_URL }}
          # Orden de las categorías en la página. Las que no estén acá van
          # después, alfabéticas.
          FAQ_CATEGORY_ORDER: ''
        run: npm run fetch-faqs

      - name: Commit faqs.json on develop
        working-directory: source
        run: |
          git config user.name "vokkado-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- public/faqs.json; then
            git add public/faqs.json
            git commit -m "chore: actualizar preguntas frecuentes"
            git push origin develop
          else
            echo "Sin cambios en faqs.json"
          fi

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: deployed

      - name: Publish faqs.json to gh-pages
        run: |
          cp source/public/faqs.json deployed/faqs.json
          cd deployed
          git config user.name "vokkado-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- faqs.json; then
            git add faqs.json
            git commit -m "chore: actualizar preguntas frecuentes en el sitio publicado"
            git push origin gh-pages
          else
            echo "Sin cambios para publicar"
          fi
