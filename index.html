<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- La landing tiene las dos versiones y sigue al sistema: si el navegador
         está en oscuro, se ve oscura, y si no, clara. No hay interruptor propio. -->
    <meta name="color-scheme" content="light dark">
    <!-- La barra del navegador y la del sistema toman el color de la marca, y
         el de la línea profesional mientras estás en /nutricionistas. -->
    <meta name="theme-color" content="#22521D">
    <title>Vokkado Uruguay - Tu Guía de Alimentación Saludable</title>
    <link rel="icon" type="image/png" href="./images/Logo.png">

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f%5B%5D=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        // El oscuro lo decide el navegador, no un botón nuestro: las variantes
        // dark: se activan solas con prefers-color-scheme: dark.
        darkMode: 'media',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
              lexend: ['Lexend', 'sans-serif'],
              alan: ['"Alan Sans"', 'sans-serif'],
              display: ['"Clash Display"', 'Poppins', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#5B8806',
                light: '#B8C445',
                dark: '#22521D',
                lightest: '#E8F0D4',
              },
              // Línea profesional (Vokkado nutri). El verde es la góndola,
              // el teal es el consultorio: mismo sistema, otro territorio.
              nutri: {
                DEFAULT: '#146B63',
                light: '#6FC2B8',
                dark: '#0C4B45',
                lightest: '#E3F2EF',
              },
              secondary: {
                DEFAULT: '#885B02',
                light: '#A67A2E',
                dark: '#6B4801',
              },
              // Superficies del modo oscuro. Cada línea tiene las suyas, teñidas
              // con su propio color, así el oscuro no es un gris genérico sino
              // la misma marca con menos luz.
              night: {
                DEFAULT: '#101A12',
                soft: '#131F15',
                deep: '#0C150E',
                card: '#18241A',
              },
              nightNutri: {
                DEFAULT: '#0E1A18',
                soft: '#10201D',
                deep: '#0B1513',
                card: '#152422',
              },
              alternative: '#A7BECE',
              neutral: {
                lightest: '#F9FAFB',
                light: '#F3F4F6',
                medium: '#9CA3AF',
                DEFAULT: '#6B7280',
                dark: '#374151',
                darkest: '#1F2937',
              },
              black: '#000000',
              white: '#FCFCFC',
              friendlyWhite: '#F1F1F1',
              dark: '#161616',
              grey: '#727272',
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.7s cubic-bezier(0.16,1,0.3,1) forwards',
              'fade-in-down': 'fadeInDown 0.7s cubic-bezier(0.16,1,0.3,1) forwards',
              'fade-in-left': 'fadeInLeft 0.7s cubic-bezier(0.16,1,0.3,1) forwards',
              'fade-in-right': 'fadeInRight 0.7s cubic-bezier(0.16,1,0.3,1) forwards',
              'scale-in': 'scaleIn 0.6s cubic-bezier(0.16,1,0.3,1) forwards',
              'bounce': 'bounce 1s infinite',
              'float': 'float 6s ease-in-out infinite',
              'float-delayed': 'float 6s ease-in-out 3s infinite',
              'pulse-soft': 'pulseSoft 4s ease-in-out infinite',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(40px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeInDown: {
                '0%': { opacity: '0', transform: 'translateY(-40px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeInLeft: {
                '0%': { opacity: '0', transform: 'translateX(-40px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              },
              fadeInRight: {
                '0%': { opacity: '0', transform: 'translateX(40px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.9)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              pulseSoft: {
                '0%, 100%': { opacity: '0.4' },
                '50%': { opacity: '0.7' },
              },
            }
          }
        }
      }
    </script>

    <!-- Importmap -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.1.0",
        "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
        "react/": "https://esm.sh/react@^19.1.0/"
      }
    }
    </script>

    <link rel="stylesheet" href="./index.css">

    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- Material Design Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1WR8Q02XH9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1WR8Q02XH9');
    </script>
</head>

<body class="font-sans">
    <div id="root"></div>
    <script>
      (function () {
        var meta = document.querySelector('meta[name="theme-color"]');
        function pintarBarra() {
          var esNutri = location.hash.indexOf('#/nutricionistas') === 0;
          meta.setAttribute('content', esNutri ? '#0C4B45' : '#22521D');
        }
        pintarBarra();
        window.addEventListener('hashchange', pintarBarra);
      })();
    </script>
    <script type="module" src="./index.tsx"></script>  
</body>
</html>
